/* ===== Hearing station – styles ===== */
:root {
  --bg: #eaf2f5;
  --panel: #ffffff;
  --ink: #15324a;
  --ink-soft: #4c6577;
  --primary: #0f6f7f;
  --primary-dark: #0a5562;
  --primary-soft: #d6ecef;
  --accent: #2e6fb7;
  --normal: #1d8656;
  --normal-soft: #dcf2e6;
  --cond: #b4531c;
  --cond-soft: #fbe8db;
  --problem: #d8402f;
  --line: #c9d9e0;
  --shadow: 0 0.15rem 0.6rem rgba(21, 50, 74, 0.10);
  --radius: 1.1rem;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Everything is sized in rem; the root size follows the screen so the
   layout fits a landscape tablet without scrolling. */
html {
  font-size: min(2.35vh, 1.45vw);
  height: 100%;
}
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans", "Noto Sans Sinhala", "Noto Sans Tamil", Roboto, "Segoe UI", system-ui, sans-serif;
  line-height: 1.35;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
html[lang="si"] body { font-family: "Noto Sans Sinhala", "Noto Sans", "Iskoola Pota", Roboto, sans-serif; }
html[lang="ta"] body { font-family: "Noto Sans Tamil", "Noto Sans", "Latha", Roboto, sans-serif; }
html[lang="si"], html[lang="ta"] { line-height: 1.45; }

[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }

.app { height: 100%; display: flex; flex-direction: column; }

.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.active { display: flex; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- top bar ---------- */
.topbar {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 0.7rem 1.4rem;
  background: var(--primary);
  color: #fff;
  min-height: 4.6rem;
}
.brand { display: flex; flex-direction: column; }
.brand-ex { font-size: 1.05rem; opacity: .85; letter-spacing: .02em; }
.brand-title { font-size: 2.1rem; font-weight: 700; line-height: 1.1; }
.topbar-title {
  flex: 1; margin: 0; text-align: center;
  font-size: 1.55rem; font-weight: 700; line-height: 1.15;
}
.nav-btn {
  flex: none;
  display: inline-flex; align-items: center; gap: .45rem;
  min-width: 9.5rem; justify-content: center;
  padding: .65rem 1.1rem;
  border-radius: 0.8rem;
  background: rgba(255,255,255,.16);
  border: 2px solid rgba(255,255,255,.45);
  color: #fff; font-size: 1.25rem; font-weight: 600;
}
.nav-btn:active { background: rgba(255,255,255,.32); }
.nav-btn svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- footer ---------- */
.footer {
  flex: none;
  text-align: center;
  padding: .45rem 1rem;
  font-size: 1rem;
  color: var(--ink-soft);
  background: #dbe8ed;
  border-top: 1px solid var(--line);
}

/* ---------- home ---------- */
.home-main {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 1.4rem 2.5rem 1rem;
  gap: 1.2rem;
}
.lang-row { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
.lang-label { font-size: 1.3rem; color: var(--ink-soft); font-weight: 600; }
.lang-buttons { display: flex; gap: .8rem; }
.lang-btn {
  min-width: 10rem; padding: .7rem 1.4rem;
  font-size: 1.45rem; font-weight: 700;
  border-radius: 3rem;
  background: var(--panel); color: var(--primary);
  border: 3px solid var(--primary-soft);
  box-shadow: var(--shadow);
}
.lang-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.lang-btn[data-lang="si"] { font-family: "Noto Sans Sinhala", sans-serif; }
.lang-btn[data-lang="ta"] { font-family: "Noto Sans Tamil", sans-serif; }

.home-intro {
  margin: 0; max-width: 56rem; text-align: center;
  font-size: 1.55rem; color: var(--ink);
  max-height: 5.4em; overflow: hidden;
}
.home-buttons {
  flex: 1; min-height: 0; width: 100%; max-width: 70rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
}
.big-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  padding: 1.5rem 2rem;
  border-radius: 1.6rem;
  color: #fff; text-align: center;
  box-shadow: 0 .4rem 1.2rem rgba(21,50,74,.18);
  transition: transform .1s;
  min-height: 0;
}
.big-btn:active { transform: scale(.98); }
.big-btn-test { background: linear-gradient(160deg, #1a8798, #0d5f6d); }
.big-btn-exp  { background: linear-gradient(160deg, #3a7fc4, #24589a); }
.big-icon { width: 6.5rem; height: 6.5rem; flex: none; }
.big-text { display: flex; flex-direction: column; gap: .5rem; }
.big-title { font-size: 2.3rem; font-weight: 800; line-height: 1.15; }
.big-sub { font-size: 1.25rem; opacity: .92; }
.headphones-note { margin: 0; font-size: 1.3rem; color: var(--ink-soft); font-weight: 600; }

/* ---------- acknowledgement ---------- */
.ack-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 1.2rem 2rem; }
.ack-card {
  width: 100%; max-width: 54rem;
  background: var(--panel); border-radius: 1.6rem; box-shadow: var(--shadow);
  padding: 1.8rem 2.6rem;
  display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
}
.ack-list { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: .9rem; }
.ack-list li { display: flex; align-items: center; gap: 1.1rem; font-size: 1.55rem; font-weight: 600; }
.ack-ico {
  flex: none; width: 3.2rem; height: 3.2rem; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--primary-soft); color: var(--primary-dark);
  font-weight: 800; font-size: 1.15rem;
}
.ack-check {
  display: flex; align-items: center; gap: 1rem;
  padding: .9rem 1.6rem; border-radius: 1rem;
  background: #f3f8fa; border: 3px solid var(--line);
  font-size: 1.6rem; font-weight: 700; cursor: pointer;
}
.ack-check input { position: absolute; opacity: 0; pointer-events: none; }
.check-box {
  width: 2.6rem; height: 2.6rem; border-radius: .5rem; flex: none;
  border: 3px solid var(--primary); background: #fff;
  display: grid; place-items: center;
}
.ack-check input:checked + .check-box { background: var(--primary); }
.ack-check input:checked + .check-box::after {
  content: ""; width: .8rem; height: 1.4rem; margin-top: -.3rem;
  border: solid #fff; border-width: 0 .32rem .32rem 0; transform: rotate(45deg);
}
.ack-check:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.primary-btn {
  min-width: 18rem; padding: 1rem 2.4rem;
  border-radius: 1rem;
  background: var(--primary); color: #fff;
  font-size: 1.7rem; font-weight: 800;
  box-shadow: var(--shadow);
}
.primary-btn:active { background: var(--primary-dark); }
.primary-btn:disabled { background: #b7c8cf; box-shadow: none; }
.ack-note { margin: 0; font-size: 1.15rem; color: var(--ink-soft); text-align: center; }

/* ---------- list ---------- */
.list-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1rem 2rem .6rem; gap: .9rem; }
.list-sub { margin: 0; text-align: center; font-size: 1.4rem; font-weight: 600; color: var(--ink-soft); }
.cards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1.2rem; }
.card {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
  align-content: center; column-gap: 1.4rem; row-gap: .3rem;
  padding: 1rem 1.6rem;
  text-align: left;
  background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  border: 3px solid transparent;
  min-height: 0; overflow: hidden;
}
.card:active { border-color: var(--accent); }
.card-icon { grid-row: 1 / 3; width: 5rem; height: 5rem; color: var(--accent); align-self: center; padding: .6rem; background: #e3eef9; border-radius: 1rem; }
.card-name { font-size: 1.6rem; font-weight: 800; line-height: 1.2; align-self: end; }
.card-sub { font-size: 1.2rem; color: var(--ink-soft); align-self: start; }
.audio-admin { margin: 0; text-align: right; font-size: .9rem; color: #8aa0ad; }
.link-btn { color: #7d95a3; text-decoration: underline; font-size: .9rem; padding: .2rem .4rem; }

/* ---------- condition page ---------- */
.cond-main {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem;
  padding: .9rem 1.4rem;
}
.cond-left, .cond-right { min-height: 0; display: flex; flex-direction: column; gap: .9rem; }
.cond-text {
  flex: none; margin: 0;
  max-height: 48%;
  overflow: hidden;
  font-size: 1.45rem;
  background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1rem 1.3rem;
}
.diagram-wrap {
  flex: 1; min-height: 0; position: relative;
  background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: .5rem;
  display: flex; flex-direction: column;
}
.diagram { flex: 1; min-height: 0; width: 100%; }
.problem-key { position: absolute; right: 1rem; bottom: .6rem; display: flex; align-items: center; gap: .5rem; font-size: 1.05rem; font-weight: 700; color: var(--problem); }
.key-dot { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 3px dashed var(--problem); background: rgba(216,64,47,.12); }

/* diagram parts */
.d-skin { fill: #f4d7c4; stroke: #c99a80; stroke-width: 3; }
.d-line { fill: none; stroke: #c99a80; stroke-width: 2.5; stroke-linecap: round; }
.d-canal { fill: #f9e6d8; stroke: #c99a80; stroke-width: 2.5; }
.d-drum { fill: #e8b9a0; stroke: #b07a60; stroke-width: 2; }
.d-middle { fill: #eef3f6; stroke: #b8c9d2; stroke-width: 2; }
.d-bones circle, .d-bones path { fill: #fff6e6; stroke: #a58a5a; stroke-width: 2.5; stroke-linejoin: round; }
.d-bones path:first-of-type { fill: none; }
.d-balance ellipse { fill: none; stroke: #7fb4c9; stroke-width: 6; }
.d-cochlea, .d-cochlea-base { fill: none; stroke: #4aa0c4; stroke-width: 8; stroke-linecap: round; }
.d-nerve { fill: none; stroke: #e5b432; stroke-width: 9; stroke-linecap: round; }
.d-nerve-thin { stroke-width: 6; opacity: .8; }
.d-brain { fill: #f3c9d3; stroke: #c78a99; stroke-width: 3; }
.d-tumour { fill: #c9533f; stroke: #8f3123; stroke-width: 2.5; display: none; }
.d-label { font-size: 15px; font-weight: 700; fill: #34505f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.d-label-tumour { fill: #a23a2a; display: none; }
.d-highlight {
  fill: rgba(216,64,47,.10); stroke: var(--problem); stroke-width: 4; stroke-dasharray: 10 7;
  transform-box: fill-box; transform-origin: center;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.08); opacity: .65; } }
.d-ear-badge { font-size: 30px; font-weight: 800; fill: #b4531c; display: none; }
.diagram.neuro .d-tumour, .diagram.neuro .d-label-tumour { display: inline; }
.diagram.neuro .d-ear-badge { display: inline; }

/* player – sizes in em so the whole panel can shrink to fit (see fitText) */
.player {
  flex: 1; min-height: 0; overflow: hidden;
  font-size: 1rem;
  background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: .9em 1.2em;
  display: flex; flex-direction: column; gap: .7em;
}
.status-label {
  flex: none;
  min-height: 3.5em;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  font-size: 1.6em; font-weight: 800; letter-spacing: .03em; line-height: 1.15;
  padding: .35em .8em; border-radius: .55em;
  background: #eef3f6; color: var(--ink-soft);
  border: 3px solid var(--line);
  transition: background .4s, color .4s, border-color .4s;
}
.status-label small { display: block; margin-top: .3em; font-size: .6em; font-weight: 600; letter-spacing: 0; line-height: 1.3; }
.status-label.normal { background: var(--normal-soft); color: var(--normal); border-color: var(--normal); }
.status-label.cond { background: var(--cond-soft); color: var(--cond); border-color: var(--cond); }

.progress { flex: none; position: relative; height: .7em; background: #e2ebef; border-radius: 1em; overflow: hidden; }
.progress-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--primary); border-radius: 1em; }
.progress-mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--cond); left: 30%; }

.player-row { flex: none; display: flex; align-items: flex-end; gap: 1em; }
.play-btn {
  flex: none;
  display: inline-flex; align-items: center; gap: .35em;
  padding: .5em 1em; min-width: 7em; justify-content: center;
  border-radius: 2em;
  background: var(--primary); color: #fff;
  font-size: 1.65em; font-weight: 800;
  box-shadow: var(--shadow);
}
.play-btn:active { background: var(--primary-dark); }
.play-btn:disabled { background: #b7c8cf; }
.play-btn svg { width: 1.15em; height: 1.15em; fill: currentColor; }
.play-btn .ico-stop { display: none; }
.play-btn.playing { background: #36566b; }
.play-btn.playing .ico-play { display: none; }
.play-btn.playing .ico-stop { display: inline; }

.compare { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .25em; }
.compare-hint { font-size: .95em; color: var(--ink-soft); line-height: 1.2; }
.segmented { display: flex; border-radius: .8em; overflow: hidden; border: 3px solid var(--line); }
.segmented button {
  flex: 1; min-height: 3.2em; padding: .3em .5em;
  font-size: 1.1em; font-weight: 700; line-height: 1.15;
  background: #f5f8fa; color: var(--ink-soft);
}
.segmented button + button { border-left: 3px solid var(--line); }
.segmented button[data-mode="normal"].on { background: var(--normal); color: #fff; }
.segmented button[data-mode="cond"].on { background: var(--cond); color: #fff; }
.segmented[data-disabled="true"] { opacity: .45; }

.audio-missing { flex: none; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .5em; }
.audio-missing p { margin: 0; font-size: 1.15em; color: var(--problem); font-weight: 700; }
.audio-missing .primary-btn { font-size: 1.4em; min-width: 0; padding: .55em 1.4em; }

.extra { display: none; flex: none; flex-direction: column; gap: .4em; border-top: 2px solid #edf2f4; padding-top: .6em; }
.extra.show { display: flex; }
.extra-label { font-size: 1.1em; font-weight: 700; color: var(--ink-soft); }
.choice { display: flex; gap: .5em; }
.choice button {
  flex: 1; padding: .5em .4em;
  border-radius: .65em; border: 3px solid var(--line);
  background: #f5f8fa; font-size: 1.25em; font-weight: 700; color: var(--ink);
}
.choice button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.neuro-row { display: flex; flex-direction: column; gap: .1em; }
.slider-wrap { display: flex; align-items: center; gap: .8em; font-size: 1.05em; font-weight: 700; color: var(--ink-soft); }
.slider-wrap input { flex: 1; min-width: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 2.4em; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: .7em; border-radius: 1em; background: linear-gradient(90deg, #f3d36b, #c9533f); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 2.2em; height: 2.2em; margin-top: -.75em; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: var(--shadow); }
input[type=range]::-moz-range-track { height: .7em; border-radius: 1em; background: linear-gradient(90deg, #f3d36b, #c9533f); }
input[type=range]::-moz-range-thumb { width: 2em; height: 2em; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }

.lr-row { display: flex; align-items: center; gap: .7em; background: #fff7e2; border: 2px solid #f0d58a; border-radius: .7em; padding: .4em .7em; }
.lr-badge { flex: none; width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--cond); color: #fff; font-weight: 800; font-size: 1.2em; display: grid; place-items: center; }
.lr-text { flex: 1; font-size: .95em; line-height: 1.3; }
.small-btn { flex: none; max-width: 9em; padding: .5em .7em; border-radius: .6em; background: #fff; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 1em; line-height: 1.2; }

.todo {
  flex: none;
  max-height: 36%;
  display: flex; flex-direction: column;
  background: #e5f3ea; border: 3px solid #a9d8bb; border-radius: var(--radius);
  padding: .6rem 1.1rem;
  transition: box-shadow .4s, border-color .4s;
}
.todo h2 { flex: none; margin: 0 0 .15rem; font-size: 1.25rem; color: var(--normal); }
.todo p { margin: 0; font-size: 1.3rem; font-weight: 600; overflow: hidden; min-height: 0; }
.todo.highlight { border-color: var(--normal); box-shadow: 0 0 0 .4rem rgba(29,134,86,.25); animation: glow 1.2s ease 2; }
@keyframes glow { 50% { box-shadow: 0 0 0 .8rem rgba(29,134,86,.12); } }
/* left/right flash */
.lr-flash {
  position: fixed; top: 40%; padding: 1.2rem 2.4rem; border-radius: 1.2rem;
  background: var(--cond); color: #fff; font-size: 3rem; font-weight: 800;
  box-shadow: 0 .6rem 2rem rgba(0,0,0,.25);
  pointer-events: none;
}
.lr-flash.left { left: 6%; }
.lr-flash.right { right: 6%; }

/* load error */
.load-error { padding: 2rem; font-family: sans-serif; font-size: 20px; color: #15324a; }
.load-error code { background: #fff; padding: .2em .4em; border-radius: .3em; }

/* portrait warning: the station is designed for landscape */
@media (orientation: portrait) {
  html { font-size: 2.2vw; }
}

</style>

<script>
/* =====================================================================
   HEARING STATION – app logic and live audio simulation
   ===================================================================== */
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     SETTINGS YOU MAY WANT TO CHANGE
     ------------------------------------------------------------------ */
  var CONFIG = {
    // Master volume ceiling (0 to 1). The speech is first evened out to a
    // fixed loudness, then multiplied by this. Lower = quieter.
    MAX_VOLUME: 0.35,
    // Absolute peak limit after everything (0 to 1). Nothing can ever be
    // louder than this, whatever the recording is like.
    PEAK_LIMIT: 0.4,
    // Loudness every recording is evened out to before MAX_VOLUME.
    SPEECH_LEVEL: 0.1,

    NORMAL_SECONDS: 5,      // how long the clip plays normally first
    AUTO_FADE_SECONDS: 1.2, // smooth change from normal to condition
    TOGGLE_FADE_SECONDS: 0.25,
    IDLE_SECONDS: 60,       // no touch for this long -> back to home
    FULLSCREEN: true,       // go full screen on first touch

    // Recording names: speech-en.mp3, speech-si.mp3, speech-ta.mp3
    // (.m4a also works). A single speech.mp3 is used for any language
    // that has no recording of its own.
    AUDIO_LANGS: ['en', 'si', 'ta'],
    AUDIO_EXTS: ['mp3', 'm4a'],
    HEARWHO_LINK: 'intent://#Intent;package=com.hearxgroup.hearwho;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.hearxgroup.hearwho;end',

    // Tinnitus sound levels (kept well below the speech).
    TINNITUS: { ring: 0.012, buzz: 0.05, hiss: 0.045 },
    NOISE_RING_LEVEL: 0.008,  // soft 4 kHz ringing for noise-induced loss

    DEFAULT_LANG: 'en'
  };

  var T = window.TEXT;
  if (!T) return;

  /* ------------------------------------------------------------------
     Small helpers
     ------------------------------------------------------------------ */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var dbToGain = function (db) { return Math.pow(10, db / 20); };

  var state = {
    lang: CONFIG.DEFAULT_LANG,
    screen: 'home',
    cond: null,
    params: { severity: 1, sound: 'ring', stage: 2 },
    lastTouch: Date.now()
  };

  function t(key) {
    var pack = T[state.lang] || T.en;
    return (pack[key] != null) ? pack[key] : (T.en[key] != null ? T.en[key] : key);
  }

  /* ------------------------------------------------------------------
     Language
     ------------------------------------------------------------------ */
  function applyLanguage() {
    document.documentElement.lang = state.lang;
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === state.lang); });
    if (state.cond) renderCondition();
    updateAudioUI();
    fitText();
  }

  function setLanguage(lang) {
    if (!T[lang]) return;
    state.lang = lang;
    try { localStorage.setItem('hearing-lang', lang); } catch (e) { /* ignore */ }
    applyLanguage();
  }

  /* Shrinks text that would overflow its box, so nothing needs scrolling. */
  function fitText() {
    requestAnimationFrame(function () {
      $$('.screen.active [data-fit]').forEach(function (el) {
        el.style.fontSize = '';
        var size = parseFloat(getComputedStyle(el).fontSize);
        var min = size * 0.6;
        while (el.scrollHeight > el.clientHeight + 1 && size > min) {
          size *= 0.95;
          el.style.fontSize = size + 'px';
        }
      });
    });
  }

  /* ------------------------------------------------------------------
     Screens
     ------------------------------------------------------------------ */
  function show(name) {
    if (name !== 'cond') stopPlayback();
    state.screen = name;
    $$('.screen').forEach(function (s) { s.classList.toggle('active', s.id === 'screen-' + name); });
    if (name === 'ack') { $('#ackBox').checked = false; updateAck(); }
    if (name === 'home' || name === 'list') state.cond = null;
    fitText();
  }

  function goHome() {
    stopPlayback();
    state.params = { severity: 1, sound: 'ring', stage: 2 };
    show('home');
  }

  /* ------------------------------------------------------------------
     Acknowledgement + hearWHO
     ------------------------------------------------------------------ */
  function updateAck() { $('#ackContinue').disabled = !$('#ackBox').checked; }

  function openHearWHO() {
    if (!$('#ackBox').checked) return;
    window.location.href = CONFIG.HEARWHO_LINK;
    // When the visitor comes back from the app, start fresh on the home page.
    setTimeout(goHome, 1500);
  }

  /* ------------------------------------------------------------------
     Conditions
     ------------------------------------------------------------------ */
  var CONDITIONS = {
    presby: { highlight: 'cochlea' },
    noise:  { highlight: 'cochlea' },
    tinn:   { highlight: 'both' },
    neuro:  { highlight: 'nerve' }
  };

  function openCondition(id) {
    state.cond = id;
    renderCondition();
    show('cond');
    resetPlayerUI();
  }

  function renderCondition() {
    var id = state.cond;
    $('#condTitle').textContent = t(id + 'Name');
    $('#condText').textContent = t(id + 'Text');
    $('#condTodo').textContent = t(id + 'Todo');
    $('#toggleCondBtn').textContent = t(id + 'Short');

    $$('.extra').forEach(function (el) { el.classList.toggle('show', el.getAttribute('data-for') === id); });
    syncChoiceButtons();
    $('#stageSlider').value = state.params.stage;

    // Diagram highlight
    var dia = $('#diagram');
    dia.classList.toggle('neuro', id === 'neuro');
    var hl = $('#dHighlight');
    var where = CONDITIONS[id].highlight;
    if (where === 'nerve') { setAttrs(hl, { cx: 370, cy: 132, r: 34 }); }
    else if (where === 'both') { setAttrs(hl, { cx: 330, cy: 150, r: 66 }); }
    else { setAttrs(hl, { cx: 300, cy: 160, r: 46 }); }

    updateStatusLabel();
    fitText();
  }

  function setAttrs(el, attrs) { for (var k in attrs) el.setAttribute(k, attrs[k]); }

  function syncChoiceButtons() {
    $$('.choice').forEach(function (group) {
      var p = group.getAttribute('data-param');
      $$('button', group).forEach(function (b) {
        b.classList.toggle('on', String(state.params[p]) === b.getAttribute('data-value'));
      });
    });
  }

  /* Draws the cochlea spiral in the diagram. */
  function drawCochlea() {
    var cx = 300, cy = 160, turns = 2.6, rMax = 34, rMin = 6, steps = 120, d = '';
    for (var i = 0; i <= steps; i++) {
      var f = i / steps;
      var a = Math.PI + f * turns * 2 * Math.PI;
      var r = rMax - (rMax - rMin) * f;
      var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    $('#cochleaSpiral').setAttribute('d', d);
  }

  /* ------------------------------------------------------------------
     AUDIO ENGINE
     One speech recording is processed live with the Web Audio API.

       speech -> level -> mono ─┬─> normal bus ───────────────┐
                                └─> condition effect -> cond bus ┴─> master volume -> peak limiter -> headphones

     The two buses are cross-faded to switch between normal and condition.
     ------------------------------------------------------------------ */
  var ctx = null, master = null, limiter = null;
  // One recording per language: speech-en / speech-si / speech-ta (.mp3 or .m4a).
  // 'any' is the older single speech.mp3, used for languages without their own.
  var speech = {};             // lang -> { buffer, level, source }
  var audioStatus = 'loading'; // loading | ready | missing | error
  var play = null;             // the current playback, or null

  function getCtx() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = CONFIG.MAX_VOLUME;
    master.channelCount = 2;
    master.channelCountMode = 'explicit';
    limiter = ctx.createWaveShaper();
    var n = 2048, curve = new Float32Array(n), L = CONFIG.PEAK_LIMIT;
    for (var i = 0; i < n; i++) {
      var x = (i / (n - 1)) * 2 - 1;
      curve[i] = L * Math.tanh(x / L);
    }
    limiter.curve = curve;
    master.connect(limiter);
    limiter.connect(ctx.destination);
    return ctx;
  }

  function resumeCtx() {
    var c = getCtx();
    if (c.state === 'suspended') c.resume();
  }

  /* Measures the recording and works out the gain that evens it out. */
  function measureLevel(buf) {
    var sum = 0, count = 0, peak = 0;
    for (var ch = 0; ch < buf.numberOfChannels; ch++) {
      var d = buf.getChannelData(ch);
      for (var i = 0; i < d.length; i += 4) {
        var v = Math.abs(d[i]);
        if (v > peak) peak = v;
        // ignore near-silence so pauses don't fool the measurement
        if (v > 0.003) { sum += v * v; count++; }
      }
    }
    var rms = count ? Math.sqrt(sum / count) : 0;
    if (!rms || !peak) return 1;
    var g = CONFIG.SPEECH_LEVEL / rms;
    return Math.min(g, 0.9 / peak);
  }

  function decode(arr) {
    var c = getCtx();
    return new Promise(function (resolve, reject) { c.decodeAudioData(arr, resolve, reject); });
  }

  function store(key, arr, source) {
    return decode(arr).then(function (buf) {
      speech[key] = { buffer: buf, level: measureLevel(buf), source: source };
    });
  }

  /* The recording for the current language, or the best substitute. */
  function currentSpeech() {
    var order = [state.lang, 'any'].concat(CONFIG.AUDIO_LANGS);
    for (var i = 0; i < order.length; i++) if (speech[order[i]]) return speech[order[i]];
    return null;
  }

  function fetchFirst(names) {
    if (!names.length) return Promise.reject(new Error('not found'));
    return fetch(names[0])
      .then(function (r) { if (!r.ok) throw new Error('not found'); return r.arrayBuffer(); })
      .catch(function () { return fetchFirst(names.slice(1)); });
  }

  function loadOne(key) {
    var base = key === 'any' ? 'speech' : 'speech-' + key;
    // 1. built into the single-file version (hearing-station.html)
    var embedded = window.EMBEDDED_SPEECH && window.EMBEDDED_SPEECH[key];
    if (embedded) {
      var bin = atob(embedded), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return store(key, bytes.buffer, 'file').catch(function () {});
    }
    // 2. a file next to the page, 3. a file chosen earlier on this tablet
    return fetchFirst(CONFIG.AUDIO_EXTS.map(function (ext) { return base + '.' + ext; }))
      .then(function (arr) { return store(key, arr, 'file'); })
      .catch(function () {
        return dbGet(base).then(function (blob) {
          if (!blob) return;
          return blob.arrayBuffer().then(function (arr) { return store(key, arr, 'chosen'); });
        });
      })
      .catch(function () {});
  }

  function loadAudio() {
    audioStatus = 'loading';
    updateAudioUI();
    Promise.all(CONFIG.AUDIO_LANGS.concat('any').map(loadOne)).then(function () {
      audioStatus = currentSpeech() ? 'ready' : 'missing';
      updateAudioUI();
    });
  }

  function chooseAudio() { $('#audioFileInput').click(); }

  /* A file picked by hand is used for the language currently selected. */
  function onFileChosen(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var lang = state.lang;
    file.arrayBuffer()
      .then(function (arr) { return store(lang, arr, 'chosen'); })
      .then(function () { audioStatus = 'ready'; updateAudioUI(); dbPut('speech-' + lang, file); })
      .catch(function () { audioStatus = 'error'; updateAudioUI(); });
  }

  /* Remembers the chosen file on the tablet (IndexedDB). */
  function dbOpen() {
    return new Promise(function (resolve, reject) {
      try {
        var req = indexedDB.open('hearing-station', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      } catch (err) { reject(err); }
    });
  }
  function dbPut(key, blob) {
    return dbOpen().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(blob, key);
        tx.oncomplete = resolve; tx.onerror = resolve;
      });
    }).catch(function () { /* storage not available – fine */ });
  }
  function dbGet(key) {
    return dbOpen().then(function (db) {
      return new Promise(function (resolve) {
        var req = db.transaction('files').objectStore('files').get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { resolve(null); };
      });
    });
  }

  function updateAudioUI() {
    var ready = audioStatus === 'ready';
    $('#playerControls').hidden = !ready && audioStatus !== 'loading';
    $('#playBtn').disabled = !ready;
    $('#audioMissingBox').hidden = (audioStatus !== 'missing' && audioStatus !== 'error');
    $('#audioMissingMsg').textContent = audioStatus === 'error' ? t('audioError') : t('audioMissing');
    // Small staff line on the list page: which languages have a recording.
    $('#audioAdminStatus').textContent = audioStatus === 'loading' ? t('audioLoading') :
      CONFIG.AUDIO_LANGS.map(function (l) { return T[l].languageName + (speech[l] ? ' ✓' : ' ✗'); }).join(' · ');
    var own = speech[state.lang];
    $('.audio-admin .link-btn').textContent = t('changeAudio') + ' (' + t('languageName') + ')';
    $('.audio-admin .link-btn').hidden = !!(own && own.source === 'file');
    if (!play) updateStatusLabel();
    fitText();
  }

  /* ---------- condition effects ----------
     Each builder connects input (mono speech) to out (condition bus) and
     returns { update(params), stop() }. */

  function filter(type, freq, gainDb, q) {
    var f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    if (gainDb != null) f.gain.value = gainDb;
    if (q != null) f.Q.value = q;
    return f;
  }
  function gain(v) { var g = ctx.createGain(); g.gain.value = v; return g; }
  function tone(type, freq) { var o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; return o; }
  function smooth(param, value) { param.setTargetAtTime(value, ctx.currentTime, 0.08); }

  function noiseSource() {
    var len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var s = ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    return s;
  }

  function chain(nodes) { for (var i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); }

  var BUILDERS = {
    /* Age-related: progressive high-frequency loss */
    presby: function (input, out) {
      // [shelf above 1 kHz, above 2 kHz, above 4 kHz, low-pass Hz, overall dB]
      var PRESETS = [
        [-4, -6, -8, 7000, -1],    // mild
        [-6, -10, -14, 4500, -2],  // moderate
        [-10, -14, -18, 2500, -4]  // severe
      ];
      var s1 = filter('highshelf', 1000, 0), s2 = filter('highshelf', 2000, 0), s3 = filter('highshelf', 4000, 0);
      var lp = filter('lowpass', 8000, null, 0.7), g = gain(1);
      chain([input, s1, s2, s3, lp, g, out]);
      function update(p, instant) {
        var v = PRESETS[p.severity] || PRESETS[1];
        var set = instant ? function (prm, x) { prm.value = x; } : smooth;
        set(s1.gain, v[0]); set(s2.gain, v[1]); set(s3.gain, v[2]);
        set(lp.frequency, v[3]); set(g.gain, dbToGain(v[4]));
      }
      return { update: update, stop: function () {} };
    },

    /* Noise-induced: notch around 4 kHz + mild high loss + soft 4 kHz ringing */
    noise: function (input, out) {
      var notch = filter('peaking', 4000, -28, 1.1);
      var hs = filter('highshelf', 2000, -5);
      chain([input, hs, notch, out]);
      var ring = tone('sine', 4000), rg = gain(CONFIG.NOISE_RING_LEVEL);
      chain([ring, rg, out]);
      ring.start();
      return { update: function () {}, stop: function () { try { ring.stop(); } catch (e) {} } };
    },

    /* Tinnitus: normal speech + a phantom sound on top */
    tinn: function (input, out) {
      input.connect(out);
      var ring = tone('sine', 6000), ringG = gain(0);
      chain([ring, ringG, out]);
      var buzz = tone('sawtooth', 150), buzzLp = filter('lowpass', 900, null, 0.7), buzzG = gain(0);
      chain([buzz, buzzLp, buzzG, out]);
      var hiss = noiseSource(), hissHp = filter('highpass', 2500, null, 0.7), hissLp = filter('lowpass', 9000, null, 0.7), hissG = gain(0);
      chain([hiss, hissHp, hissLp, hissG, out]);
      ring.start(); buzz.start(); hiss.start();
      function update(p) {
        smooth(ringG.gain, p.sound === 'ring' ? CONFIG.TINNITUS.ring : 0);
        smooth(buzzG.gain, p.sound === 'buzz' ? CONFIG.TINNITUS.buzz : 0);
        smooth(hissG.gain, p.sound === 'hiss' ? CONFIG.TINNITUS.hiss : 0);
      }
      return { update: update, stop: function () { [ring, buzz, hiss].forEach(function (n) { try { n.stop(); } catch (e) {} }); } };
    },

    /* Acoustic neuroma: LEFT ear quieter + high-frequency loss + soft ringing;
       right ear unchanged. */
    neuro: function (input, out) {
      // stage 0 (early) .. 4 (late): [left level dB, shelf 1.5k dB, shelf 3k dB, low-pass Hz, ringing]
      var PRESETS = [
        [-4, -3, -6, 9000, 0.003],
        [-9, -6, -10, 6000, 0.005],
        [-15, -9, -15, 4000, 0.007],
        [-22, -12, -20, 2500, 0.009],
        [-30, -15, -25, 1500, 0.011]
      ];
      var merger = ctx.createChannelMerger(2);
      // Right ear (input 1): unchanged
      input.connect(merger, 0, 1);
      // Left ear (input 0): reduced and muffled
      var s1 = filter('highshelf', 1500, 0), s2 = filter('highshelf', 3000, 0), lp = filter('lowpass', 9000, null, 0.7), gl = gain(1);
      chain([input, s1, s2, lp, gl]);
      gl.connect(merger, 0, 0);
      // soft ringing, left ear only
      var ring = tone('sine', 4500), rg = gain(0);
      chain([ring, rg]);
      rg.connect(merger, 0, 0);
      merger.connect(out);
      ring.start();
      function update(p, instant) {
        var v = PRESETS[p.stage] || PRESETS[2];
        var set = instant ? function (prm, x) { prm.value = x; } : smooth;
        set(gl.gain, dbToGain(v[0])); set(s1.gain, v[1]); set(s2.gain, v[2]);
        set(lp.frequency, v[3]); set(rg.gain, v[4]);
      }
      return { update: update, stop: function () { try { ring.stop(); } catch (e) {} } };
    }
  };

  function startPlayback() {
    var rec = currentSpeech();
    if (!rec || !state.cond) return;
    resumeCtx();
    stopPlayback();

    var src = ctx.createBufferSource();
    src.buffer = rec.buffer;
    var level = gain(rec.level);
    // force mono so both ears get the same speech
    var mono = ctx.createGain();
    mono.channelCount = 1;
    mono.channelCountMode = 'explicit';
    mono.channelInterpretation = 'speakers';
    var normalBus = gain(1), condBus = gain(0);
    chain([src, level, mono, normalBus, master]);
    condBus.connect(master);

    var effect = BUILDERS[state.cond](mono, condBus);
    effect.update(state.params, true);

    play = {
      src: src, effect: effect, normalBus: normalBus, condBus: condBus,
      nodes: [src, level, mono, normalBus, condBus],
      start: ctx.currentTime, duration: rec.buffer.duration,
      mode: 'normal', userToggled: false, autoSwitched: false, raf: 0
    };
    src.onended = function () { if (play && play.src === src) finishPlayback(); };
    src.start();

    $('#playBtn').classList.add('playing');
    $('#playBtnText').textContent = t('stop');
    $('#modeToggle').setAttribute('data-disabled', 'false');
    $('#todoBox').classList.remove('highlight');
    $('#progressMark').style.left = Math.min(100, CONFIG.NORMAL_SECONDS / play.duration * 100) + '%';
    updateMode();
    tick();
  }

  function setMode(mode, fadeSeconds) {
    if (!play || play.mode === mode) return;
    play.mode = mode;
    var now = ctx.currentTime, end = now + fadeSeconds;
    [[play.normalBus, mode === 'normal' ? 1 : 0], [play.condBus, mode === 'cond' ? 1 : 0]].forEach(function (pair) {
      var g = pair[0].gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(pair[1], end);
    });
    updateMode();
  }

  function tick() {
    if (!play) return;
    var elapsed = ctx.currentTime - play.start;
    if (!play.userToggled && !play.autoSwitched && elapsed >= CONFIG.NORMAL_SECONDS) {
      play.autoSwitched = true;
      setMode('cond', CONFIG.AUTO_FADE_SECONDS);
    }
    $('#progressFill').style.width = Math.min(100, elapsed / play.duration * 100) + '%';
    play.raf = requestAnimationFrame(tick);
  }

  function stopPlayback() {
    if (!play) return;
    var p = play;
    play = null;
    cancelAnimationFrame(p.raf);
    p.src.onended = null;
    try { p.src.stop(); } catch (e) {}
    p.effect.stop();
    // tiny fade to avoid a click, then disconnect
    var now = ctx.currentTime;
    [p.normalBus, p.condBus].forEach(function (b) { b.gain.cancelScheduledValues(now); b.gain.setTargetAtTime(0, now, 0.02); });
    setTimeout(function () { p.nodes.forEach(function (n) { try { n.disconnect(); } catch (e) {} }); }, 200);
    resetPlayerUI();
  }

  function finishPlayback() {
    stopPlayback();
    $('#playBtnText').textContent = t('playAgain');
    $('#progressFill').style.width = '100%';
    var todo = $('#todoBox');
    todo.classList.remove('highlight');
    void todo.offsetWidth; // restart the animation
    todo.classList.add('highlight');
  }

  function resetPlayerUI() {
    $('#playBtn').classList.remove('playing');
    $('#playBtnText').textContent = t('play');
    $('#modeToggle').setAttribute('data-disabled', 'true');
    $('#progressFill').style.width = '0';
    $('#todoBox').classList.remove('highlight');
    updateMode();
  }

  function updateMode() {
    var mode = play ? play.mode : null;
    $$('#modeToggle button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === mode); });
    updateStatusLabel();
  }

  function updateStatusLabel() {
    var el = $('#statusLabel');
    el.classList.remove('normal', 'cond');
    if (play) {
      if (play.mode === 'normal') { el.textContent = t('labelNormal'); el.classList.add('normal'); }
      else { el.textContent = t('labelWith').replace('{name}', state.cond ? t(state.cond + 'Short').toUpperCase() : ''); el.classList.add('cond'); }
    } else {
      el.textContent = audioStatus === 'loading' ? t('audioLoading') : t('labelReady');
      if (audioStatus === 'ready') {
        var hint = document.createElement('small');
        hint.textContent = t('pressPlayHint');
        el.appendChild(hint);
      }
    }
  }

  function setParam(name, value) {
    state.params[name] = value;
    syncChoiceButtons();
    if (play) play.effect.update(state.params);
  }

  /* Left/right headphone check: short beep left, then right. */
  function lrTest() {
    resumeCtx();
    var flash = $('#lrFlash');
    [[-1, 'left', 'lrLeft', 0], [1, 'right', 'lrRight', 0.9]].forEach(function (s) {
      var at = ctx.currentTime + s[3];
      var o = tone('sine', 660), g = gain(0), pan = ctx.createStereoPanner();
      pan.pan.value = s[0];
      chain([o, g, pan, master]);
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(0.08, at + 0.03);
      g.gain.setValueAtTime(0.08, at + 0.55);
      g.gain.linearRampToValueAtTime(0, at + 0.6);
      o.start(at); o.stop(at + 0.65);
      o.onended = function () { pan.disconnect(); };
      setTimeout(function () {
        flash.textContent = (s[1] === 'left' ? '◀ ' : '') + t(s[2]) + (s[1] === 'right' ? ' ▶' : '');
        flash.className = 'lr-flash ' + s[1];
        flash.hidden = false;
      }, s[3] * 1000);
    });
    setTimeout(function () { flash.hidden = true; }, 1700);
  }

  /* ------------------------------------------------------------------
     Inactivity timer, full screen, screen wake lock
     ------------------------------------------------------------------ */
  function touched() { state.lastTouch = Date.now(); }

  function checkIdle() {
    if (state.screen === 'home') return;
    if (Date.now() - state.lastTouch > CONFIG.IDLE_SECONDS * 1000) goHome();
  }

  var wakeLock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }

  function goFullscreen() {
    if (!CONFIG.FULLSCREEN || document.fullscreenElement) return;
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }

  /* ------------------------------------------------------------------
     Wire up
     ------------------------------------------------------------------ */
  function init() {
    try { var saved = localStorage.getItem('hearing-lang'); if (saved && T[saved]) state.lang = saved; } catch (e) {}

    drawCochlea();
    applyLanguage();

    document.addEventListener('click', function (e) {
      var go = e.target.closest('[data-go]');
      if (go) {
        var target = go.getAttribute('data-go');
        if (target === 'home') goHome(); else show(target);
        return;
      }
      var lang = e.target.closest('[data-lang]');
      if (lang) { setLanguage(lang.getAttribute('data-lang')); return; }
      var cond = e.target.closest('[data-cond]');
      if (cond) { openCondition(cond.getAttribute('data-cond')); return; }
      var act = e.target.closest('[data-action="choose-audio"]');
      if (act) { chooseAudio(); return; }
      var choice = e.target.closest('.choice button');
      if (choice) {
        var p = choice.parentNode.getAttribute('data-param');
        var v = choice.getAttribute('data-value');
        setParam(p, p === 'severity' ? parseInt(v, 10) : v);
        return;
      }
      var modeBtn = e.target.closest('#modeToggle button');
      if (modeBtn && play) {
        play.userToggled = true;
        setMode(modeBtn.getAttribute('data-mode'), CONFIG.TOGGLE_FADE_SECONDS);
      }
    });

    $('#ackBox').addEventListener('change', updateAck);
    $('#ackContinue').addEventListener('click', openHearWHO);
    $('#playBtn').addEventListener('click', function () { if (play) stopPlayback(); else startPlayback(); });
    $('#stageSlider').addEventListener('input', function (e) { setParam('stage', parseInt(e.target.value, 10)); });
    $('#lrTestBtn').addEventListener('click', lrTest);
    $('#audioFileInput').addEventListener('change', onFileChosen);

    ['pointerdown', 'touchstart', 'keydown', 'input'].forEach(function (ev) {
      document.addEventListener(ev, touched, { passive: true, capture: true });
    });
    document.addEventListener('pointerdown', function () { resumeCtx(); goFullscreen(); keepAwake(); }, { capture: true });
    setInterval(checkIdle, 1000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') checkIdle();
      else stopPlayback();
    });
    window.addEventListener('resize', fitText);
    // stop the long-press menu / text selection on the kiosk
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    loadAudio();

    // Offline support when the page is served over https (e.g. GitHub Pages)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  window.HEARING_APP_OK = true;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
  if (!window.TEXT || !window.HEARING_APP_OK) {
    document.getElementById('loadError').hidden = false;
    document.getElementById('app').hidden = true;
  }
</script>
</body>
